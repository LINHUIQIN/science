<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测量肺活量课堂 · 入口</title>
<style>
  :root{--bg:#f4f7fb;--card:#fff;--ink:#1f2a44;--line:#e2e8f2;--brand:#2f6fed;--brand-d:#1f54c4;--shadow:0 8px 26px rgba(31,42,68,.08);}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:560px;margin:0 auto;padding:60px 20px;}
  .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#5b8bff);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:var(--shadow);margin-bottom:14px;}
  h1{font-size:24px;margin:0 0 30px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px;text-decoration:none;display:flex;align-items:center;gap:14px;font-size:22px;font-weight:800;transition:.15s;}
  .card:hover{transform:translateY(-2px);border-color:#cdd9f2;}
  .teach{color:var(--brand-d);} .stu{color:#e0496b;}
  .emoji{font-size:30px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🫁</div>
  <h1>测量肺活量课堂</h1>

  <a class="card teach" href="teacher.html">
    <span class="emoji">🧑‍🏫</span> 我是教师
  </a>

  <a class="card stu" href="student.html">
    <span class="emoji">📱</span> 我是学生
  </a>
</div>
</body>
</html>
